{% set name = "sbtab" %}
{% set version = "1.0.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sbtab-{{ version }}.tar.gz
  sha256: 486a714638a4b2a421b6bf798c86daf412e047ea4bdf6791a1ff203604b3d440

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - pip
    - python >=3.0
  run:
    - numpy >=1.16.2
    - openpyxl >=3.0
    - pandas >=1.0
    - python >=3.0
    - python-libsbml >=5.17
    - scipy >=1.0

test:
  imports:
    - sbtab
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://www.sbtab.net
  dev_url: https://github.com/tlubitz/SBtab
  summary: SBtab - Standardised Data Tables for Systems Biology
  license: MIT
  license_file: LICENSE
  description: >
    Handles I/O and creation of SBtab tables and documents, a standardised Systems Biology file format for simple yet structured data exchange.

extra:
  recipe-maintainers:
    - eladnoor
    - tlubitz
